name: OpenAPI Lint

on:
  pull_request:
    paths:
      - "docs/OPENAPI-ADMIN.yaml"
      - ".spectral.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "docs/OPENAPI-ADMIN.yaml"
      - ".spectral.yaml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Spectral lint
        run: pnpm spectral:admin
