[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
bytecode_hash = "ipfs"

[profile.default.optimizer]
enabled = true
runs = 200

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
isc = "${ISC_RPC_URL}"
bsc = "${BNB_RPC_URL}"

[etherscan]
bscscan = { key = "${BSC_SCAN_API_KEY}" }
iscscan = { key = "${ISC_SCAN_API_KEY}" }
